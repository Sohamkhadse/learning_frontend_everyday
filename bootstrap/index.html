<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        #myDiv {
            width: 200px;
            height: 200px;
            display: inline-block;
        }

    </style>
</head>
<body>
    <h1 class="text-primary">hello bootstrap</h1>
    <h1 class="text-secondary">hello bootstrap</h1>
    <h1 class="text-success">hello bootstrap</h1>
    <h1 class="text-info">hello bootstrap</h1>
    <h1 class="text-warning">hello bootstrap</h1>
    <h1 class="text-danger">hello bootstrap</h1>
    <h1 class="text-light">hello bootstrap</h1>
    <h1 class="text-dark">hello bootstrap</h1>

    <div id="myDiv" class="element bg-primary border border-3 border-warning"></div>
    <div id="myDiv" class="element bg-secondary border border-3 border-warning"></div>
    <div id="myDiv" class="element bg-success border border-3 border-warning"></div>
    <div id="myDiv" class="element bg-info border border-3 border-warning"></div>
    <div id="myDiv" class="element bg-warning border border-3 border-warning"></div>
    <div id="myDiv" class="element bg-danger border border-3 border-warning"></div>
    <div id="myDiv" class="element bg-light border border-3 border-warning"></div>
    <div id="myDiv" class="element bg-dark border border-3 border-warning"></div>

    <div id="myDiv" class="bg-primary bg-gradient"></div>
    <div id="myDiv" class="bg-secondary bg-gradient right"></div>
    <div id="myDiv" class="bg-success bg-gradient right"></div>
    <div id="myDiv" class="bg-info bg-gradient right"></div>
    <div id="myDiv" class="bg-warning bg-gradient right"></div>
    <div id="myDiv" class="bg-danger bg-gradient right"></div>
    <div id="myDiv" class="bg-light bg-gradient right"></div>
    <div id="myDiv" class="bg-dark bg-gradient right"></div>
</div>
</body>
</html>
